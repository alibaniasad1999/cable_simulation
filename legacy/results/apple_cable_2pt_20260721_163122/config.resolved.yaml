name: apple_cable_2pt
description: 'Apple charger cable taped to a vertical door at two level clamps 35
  cm apart, photographed square-on. The same physical cable as apple_cable_3pt, so
  the length measured here and there must agree -- which is the point of running both.
  The tape clamps the cable''s ANGLE as well as its position, so the ends leave close
  to vertical rather than at the catenary''s natural exit angle.

  '
cable:
  radius_m: 0.002
  youngs_modulus_pa: 80000000.0
  poisson_ratio: 0.45
  density_kg_m3: 2390.0
  length_m: 0.8928702822077956
supports:
  x_m:
  - 0.0
  - 0.35
  height_m: 1.0
  mid_fraction: null
image:
  path: images/two_point.jpg
  sat_max: 70
  val_min: 150
  step_px: 4.0
  halfwidth_px: 40.0
simulation:
  methods:
  - newton_cable
  - physx_capsule
  - warp_rod
  segments: 60
  max_time: 8.0
  settle_vel: 0.002
  substeps: 4
  iterations: 200
  stretch_damping: 0.0
  bend_damping: 0.0001
  mid_support: clamp
