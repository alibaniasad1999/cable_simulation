name: apple_cable_3pt
description: '1 m Apple charger cable taped to a door at three level points, 0 / 15
  / 35 cm from the left clamp. Photographed square-on. The tape clamps the cable''s
  ANGLE as well as its position, so the ends leave vertically rather than at the catenary''s
  natural exit angle -- expect a systematic deviation from the ideal pinned catenary
  near each clamp.

  '
cable:
  radius_m: 0.002
  youngs_modulus_pa: 80000000.0
  poisson_ratio: 0.45
  density_kg_m3: 2390.0
  length_m: 0.8931888802527346
supports:
  x_m:
  - 0.0
  - 0.15
  - 0.35
  height_m: 1.0
  mid_fraction: 0.46878929138410763
image:
  path: images/three_point.jpg
  sat_max: 70
  val_min: 150
  step_px: 4.0
  halfwidth_px: 40.0
simulation:
  methods:
  - newton_cable
  - newton_cable_tape
  - physx_capsule
  - warp_rod
  segments: 150
  max_time: 8.0
  settle_vel: 0.002
  substeps: 4
  iterations: 200
  stretch_damping: 0.0
  bend_damping: 0.0001
  mid_support: clamp
  tape_halfwidth: 0.012
  warp_bend_length_m: 0.02
